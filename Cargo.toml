[package]
name = "swapdex"
version = "0.165.4"
edition = "2021"
description = "Switch between multiple Claude Code, Codex, Gemini, and Antigravity login accounts, locally and safely."
license = "MIT"
repository = "https://github.com/youdie006/swapdex"
homepage = "https://github.com/youdie006/swapdex"
readme = "README.md"
keywords = ["cli", "claude", "codex", "accounts", "credentials"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["docs/*", "npm/*", ".github/*"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
rusqlite = { version = "0.39", features = ["bundled"] }
dirs = "6"
zeroize = "1"
tempfile = "3"
fs2 = "0.4"
base64 = "0.23"
clap_mangen = "0.3.0"
unicode-width = "0.2.2"
sha2 = "0.11.0"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
libc = "0.2.186"
tiny_http = "0.12"
ureq = "3.4.2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time"] }
