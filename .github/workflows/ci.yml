name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # macOS included: 0.17-0.24 were almost entirely macOS Keychain behavior,
    # yet tests only ever ran on Linux. Keychain operations are disabled in
    # test builds (cfg!(test) gate) and under SWAPDEX_ROOT (integration tests
    # spawn the binary with it), so runners and contributor Macs stay clean.
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test dependency auto-merge gate
        run: python3 -m unittest discover -s .github/scripts -p 'test_deps_automerge.py'
      - name: Verify first-use account setup and managed requests
        run: python3 -B scripts/verify-first-use.py --swapdex "$GITHUB_WORKSPACE/target/debug/swapdex"
      - name: Verify streaming before upstream EOF
        run: python3 -B scripts/verify-streaming.py --swapdex "$GITHUB_WORKSPACE/target/debug/swapdex"
      - name: Test the npm launcher and the publish checks
        # The launcher decides what a user sees when the binary dies. The
        # publish checks decide whether a half-landed release reports success -
        # and they sit in npm/, not npm/bin/, so this glob used to run three of
        # the seven tests and leave that guard unprotected.
        # The pattern is quoted so node expands it, not the shell: a bare
        # directory argument makes node try to load it as a module.
        run: node --test 'npm/**/*.test.mjs'
      - name: Keep the HTTP listener runtime bounded
        run: |
          # Hyper's HTTP/1 listener can flush small SSE fragments and close a
          # failed stream without completing it or breaking healthy keep-alive.
          # Permit only its current-thread Tokio runtime. Upstream HTTP remains
          # synchronous ureq/rustls with bundled roots on every platform.
          if cargo tree --locked -e normal | grep -qiE '(^|[^[:alnum:]_])(async-std|smol|reqwest|isahc|native-tls|openssl|quinn)([^[:alnum:]_]|$)'; then
            echo "An additional runtime, client framework or system-TLS binding is in the graph."
            cargo tree --locked -e normal
            exit 1
          fi
          if cargo tree --locked -e features -i tokio | grep -qE 'tokio feature "(full|rt-multi-thread|fs|process|signal)"'; then
            echo "The listener must not enable unrelated Tokio runtime features."
            exit 1
          fi
          if cargo tree --locked -e features -i hyper | grep -qE 'hyper feature "(full|client|http2)"'; then
            echo "Hyper is limited to the HTTP/1 listener."
            exit 1
          fi
      - name: TLS is rustls with bundled roots (identical on Linux, WSL, macOS)
        run: |
          cargo tree -e normal | grep -qiE '(^|[^[:alnum:]_])rustls([^[:alnum:]_]|$)' || {
            echo "rustls is expected in the graph (proxy mode's TLS)."; exit 1; }
          cargo tree -e normal | grep -qi 'webpki-roots' || {
            echo "webpki-roots is expected: bundled roots keep behaviour identical across platforms."; exit 1; }
      - name: Cargo audit
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-audit --locked
          cargo audit
