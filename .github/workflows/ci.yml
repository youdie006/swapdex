name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # macOS included: 0.17-0.24 were almost entirely macOS Keychain behavior,
    # yet tests only ever ran on Linux. Keychain operations are disabled in
    # test builds (cfg!(test) gate) and under SWAPDEX_ROOT (integration tests
    # spawn the binary with it), so runners and contributor Macs stay clean.
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
      - name: Test the npm launcher
        # It decides what a user sees when the binary dies, and it is the only
        # part of the npm install that is not the binary itself.
        # The pattern is quoted so node expands it, not the shell: a bare
        # directory argument makes node try to load it as a module.
        run: node --test 'npm/bin/**/*.test.mjs'
      - name: No async runtime or heavy HTTP stack in the graph
        run: |
          # swapdex talks to the network in exactly two places, both of which the
          # user asks for explicitly: `quota` (shells out to curl) and `proxy`
          # (relays Claude's own API traffic). Proxy mode needs a listener and a
          # client, so tiny_http + ureq/rustls ARE in the graph by design.
          #
          # What stays banned is the heavy async stack: an embedded runtime, a
          # full client framework, or a system-TLS binding. Those would change
          # what this binary is (and native-tls would make behaviour differ per
          # platform, which the Linux/WSL/macOS support promise rules out).
          if cargo tree -e normal | grep -qiE '\b(tokio|async-std|smol|hyper|reqwest|isahc|native-tls|openssl|quinn)\b'; then
            echo "A banned async runtime / heavy HTTP stack is in the dependency graph."
            cargo tree -e normal | grep -iE '\b(tokio|async-std|smol|hyper|reqwest|isahc|native-tls|openssl|quinn)\b'
            exit 1
          fi
      - name: TLS is rustls with bundled roots (identical on Linux, WSL, macOS)
        run: |
          cargo tree -e normal | grep -qi '\brustls\b' || {
            echo "rustls is expected in the graph (proxy mode's TLS)."; exit 1; }
          cargo tree -e normal | grep -qi 'webpki-roots' || {
            echo "webpki-roots is expected: bundled roots keep behaviour identical across platforms."; exit 1; }
      - name: Cargo audit
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-audit --locked
          cargo audit
