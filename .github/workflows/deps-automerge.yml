name: deps auto-merge

# This privileged workflow uses only code from the default branch. Pull request
# checkouts, artifacts, and caches are intentionally forbidden here.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.name == 'CI'
      && github.event.workflow_run.status == 'completed'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate and merge eligible Dependabot bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/deps-automerge.py
